name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter create . --platforms=android --project-name flyx_control --org com.flyxcontrol --no-pub
          rm -f test/widget_test.dart

      - name: Apply local-router Android networking
        run: python3 tool/apply_android_router_config.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flyx-control-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
